version: 2
# Weekly, grouped, minor/patch only. Major upgrades (TypeScript 7, ESLint 10, Node 25 …) are planned work, done by
# hand on a branch, not merged from a bot PR. Node stays on the LTS line used by the Dockerfile.
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - { dependency-name: "node", update-types: ["version-update:semver-major"] }
      - { dependency-name: "python", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ["*"] } }
