name: build
# Builds, pushes and signs both images on every merge to main (tag sha-<short>, edge) and on release tags (vX.Y.Z).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # keyless signing with cosign (GitHub OIDC)
      attestations: write
    strategy:
      matrix:
        include:
          - { name: api, context: apps/api, dockerfile: apps/api/Dockerfile }
          - { name: web, context: ".", dockerfile: apps/web/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/perfume-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.value || format('0.0.0-{0}', github.sha) }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - name: Summary
        run: |
          {
            echo "### perfume-${{ matrix.name }}"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '```'; echo "${{ steps.meta.outputs.tags }}"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
