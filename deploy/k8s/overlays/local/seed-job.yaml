# Local cluster only: loads reference notes/accords and the SYNTHETIC demo catalogue after migrations.
# Staging/production never run this (real data arrives through ingestion pipelines in later phases).
apiVersion: batch/v1
kind: Job
metadata:
  name: perfume-seed
  namespace: perfume
  labels: { app.kubernetes.io/name: perfume-seed, app.kubernetes.io/component: migration }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: perfume-seed }
    spec:
      restartPolicy: Never
      serviceAccountName: perfume-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: perfume-api:edge
          command: ["python", "-m", "app.seed"]
          envFrom: [{ configMapRef: { name: perfume-config } }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: perfume-db-app, key: uri } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
