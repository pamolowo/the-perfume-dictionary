# HTTPS on 443 with a certificate issued by cert-manager; plain HTTP only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: perfume
  annotations: { cert-manager.io/cluster-issuer: letsencrypt-staging }
spec:
  gatewayClassName: eg
  listeners:
    - { name: http, protocol: HTTP, port: 80, allowedRoutes: { namespaces: { from: Same } } }
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.theperfumedictionary.com"
      tls: { mode: Terminate, certificateRefs: [{ name: perfume-tls }] }
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: redirect-to-https }
spec:
  parentRefs: [{ name: perfume, sectionName: http }]
  rules:
    - filters: [{ type: RequestRedirect, requestRedirect: { scheme: https, statusCode: 301 } }]
