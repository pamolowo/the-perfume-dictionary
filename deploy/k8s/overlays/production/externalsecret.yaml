# Pulls the database URL from the cloud secret manager (key: perfume/production/database-url) into Secret
# perfume-database (key: uri). The ClusterSecretStore "cloud-secrets" is created with the cluster (Terraform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: perfume-database }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cloud-secrets }
  target: { name: perfume-database, creationPolicy: Owner }
  data:
    - secretKey: uri
      remoteRef: { key: perfume/production/database-url }
