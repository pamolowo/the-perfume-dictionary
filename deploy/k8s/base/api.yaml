apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfume-api
  namespace: perfume
  labels: { app.kubernetes.io/name: perfume-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector: { matchLabels: { app.kubernetes.io/name: perfume-api } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: perfume-api, app.kubernetes.io/component: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: perfume-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: perfume-api } }
      containers:
        - name: api
          image: perfume-api:edge
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: perfume-config } }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: perfume-database, key: uri } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: perfume-api
  labels: { app.kubernetes.io/name: perfume-api }
spec:
  selector: { app.kubernetes.io/name: perfume-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: perfume-api }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: perfume-api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: perfume-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: perfume-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
