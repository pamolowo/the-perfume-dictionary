apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: perfume-dictionary }
    includeSelectors: false
resources:
  - config.yaml
  - serviceaccounts.yaml
  - api.yaml
  - web.yaml
  - migrate-job.yaml
  - networkpolicies.yaml
  - httproutes.yaml
# No `images:` here on purpose: each overlay sets name + tag. (A rename in the base would stop the overlays'
# `name: perfume-api` from matching, silently deploying the base tag — see validate-manifests.sh.)
