# Routes attach to the Gateway named `perfume` that each overlay defines. Hostnames are set per overlay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: perfume-web }
spec:
  parentRefs: [{ name: perfume, sectionName: https }]
  hostnames: ["www.example.invalid"]
  rules:
    - backendRefs: [{ name: perfume-web, port: 3000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: perfume-api }
spec:
  parentRefs: [{ name: perfume, sectionName: https }]
  hostnames: ["api.example.invalid"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/ } }, { path: { type: PathPrefix, value: /health } }]
      backendRefs: [{ name: perfume-api, port: 8000 }]
